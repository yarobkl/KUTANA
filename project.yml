name: KUTANA
options:
  bundleIdPrefix: fr.yaroconsulting.kutana
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.9'
    MARKETING_VERSION: '1.0.1'
    CURRENT_PROJECT_VERSION: '16'
    TARGETED_DEVICE_FAMILY: '1'
    CODE_SIGN_STYLE: Automatic
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    SUPPORTS_MACCATALYST: NO
    INFOPLIST_KEY_KUTANA_SUPABASE_URL: "https://xwhjzftrzikgqweowtus.supabase.co"
    INFOPLIST_KEY_KUTANA_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_x-MshIA-X2hZ1fJJdjvtFw_dt-05xAI"
targets:
  KUTANA:
    type: application
    platform: iOS
    sources:
      - path: iOS/KUTANA
    info:
      path: iOS/KUTANA/Info.plist
      properties:
        CFBundleDisplayName: KUTANA
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleURLTypes:
          - CFBundleURLName: fr.yaroconsulting.kutana
            CFBundleURLSchemes:
              - kutana
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        KUTANA_SUPABASE_URL: "https://xwhjzftrzikgqweowtus.supabase.co"
        KUTANA_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_x-MshIA-X2hZ1fJJdjvtFw_dt-05xAI"
    entitlements:
      path: iOS/KUTANA/KUTANA.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.yaroconsulting.kutana
        INFOPLIST_KEY_CFBundleDisplayName: KUTANA
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        DEVELOPMENT_TEAM: UK4UQCQ57G
schemes:
  KUTANA:
    build:
      targets:
        KUTANA: all
    run:
      config: Debug
    archive:
      config: Release
    management:
      shared: true
