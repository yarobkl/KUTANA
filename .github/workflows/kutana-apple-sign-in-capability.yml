name: KUTANA Apple Sign In entitlement setup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kutana-apple-sign-in-capability.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kutana-apple-sign-in-capability
  cancel-in-progress: false

jobs:
  ensure-capability:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      APP_BUNDLE_ID: fr.yaroconsulting.kutana
      ASC_API_KEY_ID: 4JXDLBF8XK
      ASC_API_ISSUER_ID: 2f5dc33c-0169-47e2-ac2c-241105d0ff28
      ASC_PRIVATE_KEY: ${{ secrets.KUTANA_ASC_API_PRIVATE_KEY_P8 }}
    steps:
      - name: Install Apple API JWT dependency
        run: |
          python3 -m venv "$RUNNER_TEMP/apple-auth-venv"
          "$RUNNER_TEMP/apple-auth-venv/bin/pip" install --quiet --disable-pip-version-check 'PyJWT[crypto]'

      - name: Ensure only KUTANA App ID supports Sign in with Apple
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/apple-auth-venv/bin/python" - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          import jwt

          private = os.environ.get("ASC_PRIVATE_KEY", "")
          if "BEGIN PRIVATE KEY" not in private:
              raise SystemExit("Missing KUTANA Apple API private key: no remote updates.")
          token = jwt.encode(
              {"iss": os.environ["ASC_API_ISSUER_ID"], "iat": int(time.time()) - 20,
               "exp": int(time.time()) + 900, "aud": "appstoreconnect-v1"},
              private, algorithm="ES256",
              headers={"kid": os.environ["ASC_API_KEY_ID"], "typ": "JWT"})
          base = "https://api.appstoreconnect.apple.com"
          def api(method, path, body=None):
              payload = json.dumps(body).encode("utf-8") if body is not None else None
              request = urllib.request.Request(base + path, data=payload, method=method,
                  headers={"Authorization": "Bearer " + token, "Accept": "application/json",
                           "Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(request, timeout=35) as response:
                      raw = response.read()
                      return json.loads(raw) if raw else {}
              except urllib.error.HTTPError as error:
                  try:
                      details = json.loads(error.read().decode("utf-8"))
                      summary = "; ".join(f"{e.get('code')}: {e.get('detail', '')[:200]}"
                                          for e in details.get("errors", [])[:2])
                  except Exception:
                      summary = "No structured details"
                  raise RuntimeError(f"Apple HTTP {error.code}: {summary}") from None

          identifier = os.environ["APP_BUNDLE_ID"]
          params = urllib.parse.urlencode({"filter[identifier]": identifier, "limit": 10})
          bundles = api("GET", "/v1/bundleIds?" + params).get("data", [])
          exact = [item for item in bundles if item.get("attributes", {}).get("identifier") == identifier]
          if len(exact) != 1:
              raise SystemExit(f"Expected exactly one registered KUTANA App ID, found {len(exact)}; no changes.")
          bundle = exact[0]
          bundle_id = bundle["id"]
          print("Verified KUTANA bundle identifier:", identifier, "Apple resource ID:", bundle_id)
          def get_capabilities():
              return api("GET", f"/v1/bundleIds/{bundle_id}/bundleIdCapabilities").get("data", [])
          current = get_capabilities()
          apple_caps = [cap for cap in current if cap.get("attributes", {}).get("capabilityType") == "APPLE_ID_AUTH"]
          if apple_caps:
              print("Sign in with Apple capability already enabled for KUTANA.")
          else:
              print("Enabling Sign in with Apple as primary App ID for KUTANA only.")
              api("POST", "/v1/bundleIdCapabilities", {
                  "data": {
                      "type": "bundleIdCapabilities",
                      "attributes": {
                          "capabilityType": "APPLE_ID_AUTH",
                          "settings": [{
                              "key": "APPLE_ID_AUTH_APP_CONSENT",
                              "options": [{"key": "PRIMARY_APP_CONSENT"}]
                          }]
                      },
                      "relationships": {
                          "bundleId": {"data": {"type": "bundleIds", "id": bundle_id}}
                      }
                  }
              })
          enabled = [c for c in get_capabilities()
                     if c.get("attributes", {}).get("capabilityType") == "APPLE_ID_AUTH"]
          if not enabled:
              raise SystemExit("Apple Sign in capability was not confirmed.")
          print("SUCCESS: Apple Sign in capability enabled for KUTANA.")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as report:
              report.write("## KUTANA — Apple Sign In\n")
              report.write(f"Bundle: {identifier}\n")
              report.write("Capability: APPLE_ID_AUTH enabled.\n")
              report.write("Apple provisioning profiles may need regeneration after this change.\n")
              report.write("Supabase Auth Apple provider requires separate configuration.\n")
          PY
