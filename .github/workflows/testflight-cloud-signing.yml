name: KUTANA TestFlight (Apple cloud signing)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ci/trigger-kutana-testflight.txt'
      - 'project.yml'
      - 'iOS/KUTANA/**'
      - '.github/workflows/testflight-cloud-signing.yml'

permissions:
  contents: read

concurrency:
  group: kutana-cloud-testflight
  cancel-in-progress: false

jobs:
  upload:
    runs-on: macos-26
    timeout-minutes: 65
    env:
      APPLE_TEAM_ID: UK4UQCQ57G
      ASC_API_KEY_ID: 4JXDLBF8XK
      ASC_API_ISSUER_ID: 2f5dc33c-0169-47e2-ac2c-241105d0ff28
      ASC_API_PRIVATE_KEY_P8: ${{ secrets.KUTANA_ASC_API_PRIVATE_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4

      - name: Check Apple API access without revealing credentials
        shell: bash
        run: |
          set -euo pipefail
          for name in ASC_API_PRIVATE_KEY_P8; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing KUTANA_${name}. Add it in Settings > Secrets and variables > Actions."
              exit 1
            fi
          done
          XCODE_VERSION_OUTPUT="$(xcodebuild -version)"
          printf '%s\n' "$XCODE_VERSION_OUTPUT"
          if ! grep -Eq '^Xcode 2[6-9]([.]|$)' <<< "$XCODE_VERSION_OUTPUT"; then
            echo "::error::Xcode 26 or later is required."
            exit 1
          fi
          echo "Apple API key ID and issuer ID are configured; the private .p8 credential is present. No .p12 or manual provisioning profile is needed for this workflow."

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Prepare temporary App Store Connect key
        shell: bash
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/AuthKey_${ASC_API_KEY_ID}.p8"
          printf '%s' "$ASC_API_PRIVATE_KEY_P8" > "$key_path"
          chmod 600 "$key_path"
          if ! grep -q 'BEGIN PRIVATE KEY' "$key_path"; then
            echo "::error::The GitHub Actions secret must contain the raw contents of your Apple .p8 key file."
            exit 1
          fi
          echo "ASC_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Generate native Xcode project
        shell: bash
        run: |
          set -euo pipefail
          xcodegen generate
          xcodebuild -list -project KUTANA.xcodeproj

      - name: Archive with ad hoc signing to preserve entitlements
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project KUTANA.xcodeproj \
            -scheme KUTANA \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/KUTANA.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_IDENTITY='-' \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION='1.0.1' \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER"

      - name: Validate orientations required by App Store Connect
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, plistlib
          from pathlib import Path
          plist_path = Path(os.environ["RUNNER_TEMP"]) / "KUTANA.xcarchive" / "Products/Applications/KUTANA.app/Info.plist"
          with plist_path.open("rb") as source:
              info = plistlib.load(source)
          expected = {"UIInterfaceOrientationPortrait", "UIInterfaceOrientationPortraitUpsideDown", "UIInterfaceOrientationLandscapeLeft", "UIInterfaceOrientationLandscapeRight"}
          values = info.get("UISupportedInterfaceOrientations", [])
          print("Base orientations:", values)
          print("iPhone orientations:", info.get("UISupportedInterfaceOrientations~iphone", []))
          print("iPad orientations:", info.get("UISupportedInterfaceOrientations~ipad", []))
          if not isinstance(values, list) or not expected.issubset(set(values)):
              raise SystemExit("App Store Connect requires all four base orientations for iPad multitasking.")
          if not isinstance(info.get("UILaunchScreen"), dict) and not info.get("UILaunchStoryboardName"):
              raise SystemExit("The built archive is missing UILaunchScreen or UILaunchStoryboardName. Apple will reject iPad multitasking.")
          print("Launch screen configuration valid.")
          PY

      - name: Export signed app and verify Apple sign-in entitlement
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import plistlib
          from pathlib import Path
          options = {
              "method": "app-store-connect",
              "destination": "export",
              "signingStyle": "automatic",
              "teamID": os.environ["APPLE_TEAM_ID"],
              "manageAppVersionAndBuildNumber": False,
          }
          with (Path(os.environ["RUNNER_TEMP"]) / "KUTANA-ExportOptions.plist").open("wb") as output:
              plistlib.dump(options, output)
          PY
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/KUTANA.xcarchive" \
            -exportPath "$RUNNER_TEMP/KUTANA-export" \
            -exportOptionsPlist "$RUNNER_TEMP/KUTANA-ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_API_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_API_ISSUER_ID"
          ipa="$RUNNER_TEMP/KUTANA-export/KUTANA.ipa"
          test -s "$ipa"
          mkdir -p "$RUNNER_TEMP/KUTANA-signed"
          unzip -q "$ipa" 'Payload/KUTANA.app/*' -d "$RUNNER_TEMP/KUTANA-signed"
          app="$RUNNER_TEMP/KUTANA-signed/Payload/KUTANA.app"
          codesign --verify --strict "$app"
          codesign -d --entitlements :- "$app" > "$RUNNER_TEMP/KUTANA-signed-entitlements.plist" 2>/dev/null
          security cms -D -i "$app/embedded.mobileprovision" > "$RUNNER_TEMP/KUTANA-profile.plist"
          python3 - <<'PY'
          import os, plistlib
          from pathlib import Path
          temp = Path(os.environ['RUNNER_TEMP'])
          with (temp / 'KUTANA-signed-entitlements.plist').open('rb') as file:
              signed = plistlib.load(file)
          with (temp / 'KUTANA-profile.plist').open('rb') as file:
              profile = plistlib.load(file)
          expected = os.environ['APPLE_TEAM_ID'] + '.fr.yaroconsulting.kutana'
          for label, rights in [('Signed app', signed), ('Provisioning profile', profile['Entitlements'])]:
              if rights.get('application-identifier') != expected:
                  raise SystemExit(f'{label}: unexpected application identifier; upload stopped.')
              if rights.get('com.apple.developer.applesignin') != ['Default']:
                  raise SystemExit(f'{label}: missing Sign in with Apple entitlement; upload stopped.')
              print(f'{label}: correct bundle ID and Apple sign-in entitlement verified.')
          PY

      - name: Upload verified IPA to App Store Connect
        shell: bash
        run: |
          set -euo pipefail
          API_PRIVATE_KEYS_DIR="$RUNNER_TEMP" xcrun altool --upload-app \
            -f "$RUNNER_TEMP/KUTANA-export/KUTANA.ipa" -t ios \
            --apiKey "$ASC_API_KEY_ID" --apiIssuer "$ASC_API_ISSUER_ID"
          echo "### KUTANA cloud signing" >> "$GITHUB_STEP_SUMMARY"
          echo "Signed app and distribution profile include Apple sign-in; upload accepted. Check App Store Connect for build processing." >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary Apple authentication materials
        if: always()
        shell: bash
        run: |
          if [[ -n "${ASC_KEY_PATH:-}" ]]; then rm -f "$ASC_KEY_PATH"; fi
