name: KUTANA - Enable native Sign in with Apple

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apple-sign-in-capability.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enable:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      APPLE_BUNDLE_ID: 'fr.yaroconsulting.kutana'
      ASC_KEY_ID: '4JXDLBF8XK'
      ASC_ISSUER_ID: '2f5dc33c-0169-47e2-ac2c-241105d0ff28'
      ASC_PRIVATE_KEY: ${{ secrets.KUTANA_ASC_API_PRIVATE_KEY_P8 }}
    steps:
      - name: Install Apple API JWT signer
        run: python3 -m pip install --quiet --disable-pip-version-check "PyJWT[crypto]"
      - name: Check and configure the KUTANA bundle ID capability
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, time, urllib.parse, urllib.request, urllib.error
          import jwt

          secret = os.environ.get("ASC_PRIVATE_KEY","")
          if "BEGIN PRIVATE KEY" not in secret:
              raise SystemExit("KUTANA Apple API .p8 secret missing.")
          token = jwt.encode({
              "iss": os.environ["ASC_ISSUER_ID"],
              "iat": int(time.time()) - 20,
              "exp": int(time.time()) + 600,
              "aud": "appstoreconnect-v1"
          }, secret, algorithm="ES256",
          headers={"kid": os.environ["ASC_KEY_ID"], "typ": "JWT"})
          base = "https://api.appstoreconnect.apple.com"

          def api(method, path, payload=None):
              data = json.dumps(payload).encode("utf-8") if payload is not None else None
              req = urllib.request.Request(base+path, data=data, method=method,
                  headers={"Authorization":"Bearer "+token,
                           "Accept":"application/json",
                           "Content-Type":"application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=35) as response:
                      raw = response.read()
                      return json.loads(raw) if raw else {}
              except urllib.error.HTTPError as error:
                  raw = error.read()
                  try:
                      errs = json.loads(raw).get("errors",[])
                      msg = "; ".join(str(e.get("code",""))+": "+str(e.get("detail",""))[:250] for e in errs[:3])
                  except Exception:
                      msg = "no structured Apple error details"
                  raise RuntimeError(f"Apple API HTTP {error.code}: {msg}") from None

          identifier = os.environ["APPLE_BUNDLE_ID"]
          args = urllib.parse.urlencode({"filter[identifier]": identifier, "limit": "5"})
          found = api("GET", "/v1/bundleIds?"+args).get("data", [])
          exact = [x for x in found if x.get("attributes",{}).get("identifier")==identifier]
          if len(exact)!=1:
              raise SystemExit(f"Expected exactly one native KUTANA App ID, found {len(exact)}; no changes.")
          bundle_id = exact[0]["id"]
          print("Verified exact KUTANA App ID",identifier,"(",bundle_id,")")
          caps = api("GET",f"/v1/bundleIds/{bundle_id}/bundleIdCapabilities").get("data",[])
          if any(c.get("attributes",{}).get("capabilityType")=="APPLE_ID_AUTH" for c in caps):
              print("Sign in with Apple capability is already enabled for KUTANA.")
          else:
              request={
                  "data":{
                      "type":"bundleIdCapabilities",
                      "attributes":{
                          "capabilityType":"APPLE_ID_AUTH",
                          "settings":[{
                              "key":"APPLE_ID_AUTH_APP_CONSENT",
                              "options":[{"key":"PRIMARY_APP_CONSENT"}]
                          }]
                      },
                      "relationships":{
                          "bundleId":{"data":{"type":"bundleIds","id":bundle_id}}
                      }
                  }
              }
              api("POST","/v1/bundleIdCapabilities",request)
              print("Enabled native Sign in with Apple for KUTANA App ID.")
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as f:
              f.write("## KUTANA Apple ID capability\\n")
              f.write("Native Sign in with Apple is enabled or previously enabled for exact bundle ID.\\n")
              f.write("Supabase Auth Apple provider must additionally allow this bundle ID as client ID.\\n")
          PY
