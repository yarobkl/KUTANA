name: KUTANA - Attach processed build to internal TestFlight group

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/testflight-internal-invite.yml'
  workflow_run:
    workflows: ["KUTANA TestFlight (Apple cloud signing)"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: kutana-internal-invite
  cancel-in-progress: false

jobs:
  enable-internal-test:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      ASC_APP_ID: '6837966878'
      ASC_GROUP_ID: '013ba6e8-36f5-4f4e-8feb-f61803cd09aa'
      ASC_API_KEY_ID: '4JXDLBF8XK'
      ASC_API_ISSUER_ID: '2f5dc33c-0169-47e2-ac2c-241105d0ff28'
      ASC_API_PRIVATE_KEY_P8: ${{ secrets.KUTANA_ASC_API_PRIVATE_KEY_P8 }}
    steps:
      - name: Install temporary API client
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/asc-python"
          "$RUNNER_TEMP/asc-python/bin/pip" install --quiet --disable-pip-version-check "PyJWT[crypto]"

      - name: Check processing and enable KUTANA for its existing internal tester
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/asc-python/bin/python" - <<'PY'
          import json
          import os
          import sys
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          import jwt

          app_id = os.environ["ASC_APP_ID"]
          group_id = os.environ["ASC_GROUP_ID"]
          private_key = os.environ.get("ASC_API_PRIVATE_KEY_P8", "")
          if "BEGIN PRIVATE KEY" not in private_key:
              raise SystemExit("Missing Apple private key in GitHub Actions secret; no API request made.")
          token = jwt.encode(
              {"iss": os.environ["ASC_API_ISSUER_ID"], "iat": int(time.time()) - 20,
               "exp": int(time.time()) + 900, "aud": "appstoreconnect-v1"},
              private_key, algorithm="ES256",
              headers={"kid": os.environ["ASC_API_KEY_ID"], "typ": "JWT"})
          base = "https://api.appstoreconnect.apple.com"

          def api(method, path, body=None):
              data = json.dumps(body).encode("utf-8") if body is not None else None
              req = urllib.request.Request(
                  base + path, data=data, method=method,
                  headers={"Authorization": "Bearer " + token,
                           "Accept": "application/json",
                           "Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=35) as response:
                      raw = response.read()
                      return json.loads(raw) if raw else {}
              except urllib.error.HTTPError as error:
                  try:
                      details = json.loads(error.read().decode("utf-8"))
                      brief = "; ".join(
                          str(x.get("code", "")) + ": " + str(x.get("detail", ""))[:260]
                          for x in details.get("errors", [])[:2])
                  except Exception:
                      brief = "No structured Apple error details"
                  raise RuntimeError(f"Apple API HTTP {error.code} ({method} {path.split('?')[0]}): {brief}") from None

          group = api("GET", f"/v1/betaGroups/{group_id}")
          g = group["data"]
          if not g["attributes"].get("isInternalGroup", False):
              raise SystemExit("The configured beta group is not internal; stopped without changes.")
          related_app = g.get("relationships", {}).get("app", {}).get("data", {})
          if related_app and related_app.get("id") != app_id:
              raise SystemExit("Beta group belongs to another app; stopped without changes.")
          print("Verified existing internal group:", g["attributes"].get("name", group_id))

          params = urllib.parse.urlencode({"filter[app]": app_id, "sort": "-uploadedDate", "limit": 10})
          latest = None
          state = None
          deadline = time.monotonic() + 300
          while True:
              builds = api("GET", "/v1/builds?" + params).get("data", [])
              if not builds:
                  print("Apple has no KUTANA build listed yet; awaiting processing.", flush=True)
              else:
                  latest = builds[0]
                  attrs = latest.get("attributes", {})
                  state = attrs.get("processingState", "")
                  print("Latest KUTANA build:", latest["id"], "number:", attrs.get("version"),
                        "processing:", state, flush=True)
                  if state == "VALID":
                      break
                  if state in ("FAILED", "INVALID"):
                      raise SystemExit(f"Apple has marked the latest build {state}; not adding it to testers.")
              if time.monotonic() >= deadline:
                  raise SystemExit("No processed KUTANA build available yet; rerun once Apple completes processing.")
              time.sleep(40)

          # Audited native SwiftUI sources: HTTPS via Apple's URLSession and
          # credentials in the iOS Keychain; no non-exempt cryptography detected.
          # See Apple's ITSAppUsesNonExemptEncryption guidance. This declaration
          # is scoped to the currently processed build, not future code.
          compliance_submitted = False
          internal_state = ""
          for attempt in range(9):
              details = api("GET", "/v1/buildBetaDetails?" + urllib.parse.urlencode(
                  {"filter[build]": latest["id"], "limit": 10})).get("data", [])
              internal_state = (
                  details[0].get("attributes", {}).get("internalBuildState", "")
                  if details else "PROCESSING"
              )
              print("TestFlight internal state:", internal_state, flush=True)
              if internal_state in ("READY_FOR_BETA_TESTING", "IN_BETA_TESTING"):
                  break
              if internal_state == "MISSING_EXPORT_COMPLIANCE" and not compliance_submitted:
                  existing_declaration = latest.get("attributes", {}).get("usesNonExemptEncryption")
                  if existing_declaration is True:
                      raise SystemExit("Apple build already declares non-exempt encryption. Requires manual review.")
                  api("PATCH", f"/v1/builds/{latest['id']}", {
                      "data": {
                          "type": "builds",
                          "id": latest["id"],
                          "attributes": {"usesNonExemptEncryption": False}
                      }
                  })
                  compliance_submitted = True
                  print("Updated existing Apple build with exempt-encryption declaration.", flush=True)
              elif internal_state in ("IN_EXPORT_COMPLIANCE_REVIEW", "PROCESSING_EXCEPTION", "EXPIRED"):
                  raise SystemExit(f"Build requires Apple attention: {internal_state}.")
              if attempt == 8:
                  raise SystemExit(f"Build still not ready after compliance update: {internal_state}")
              time.sleep(12)

          assigned = api("GET", f"/v1/betaGroups/{group_id}/builds?limit=100").get("data", [])
          if latest["id"] in {b["id"] for b in assigned}:
              print("Latest build is already assigned to this internal tester group.")
          else:
              api("POST", f"/v1/betaGroups/{group_id}/relationships/builds",
                  {"data": [{"type": "builds", "id": latest["id"]}]})
              print("SUCCESS: latest processed KUTANA build assigned to internal group.")
          # One existing and verified internal tester: send or resend their email invitation.
          # Do not create or invite other people.
          testers = api("GET", f"/v1/betaGroups/{group_id}/betaTesters?limit=100").get("data", [])
          target = next((
              t for t in testers
              if t.get("attributes", {}).get("email", "").lower() == "rodrinbakala@outlook.fr"
          ), None)
          if target is None:
              raise SystemExit("Expected internal tester address is missing from this group.")
          tester_state = target.get("attributes", {}).get("state", "")
          print("Existing tester status:", tester_state)
          if tester_state in ("ACCEPTED", "INSTALLED"):
              print("Apple indicates that the tester already accepted the invitation.")
              print("No additional email can be requested for an already-accepted tester.")
          else:
              invite = api("POST", "/v1/betaTesterInvitations", {
                  "data": {
                      "type": "betaTesterInvitations",
                      "relationships": {
                          "app": {"data": {"type": "apps", "id": app_id}},
                          "betaTester": {"data": {"type": "betaTesters", "id": target["id"]}}
                      }
                  }
              })
              print("Apple accepted a TestFlight invitation request:",
                    invite.get("data", {}).get("id", "no response id"))
          print("Apple controls final email delivery and TestFlight app notifications.")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## KUTANA TestFlight internal tester\n")
              summary.write(f"App: {app_id}; group: {g['attributes'].get('name', group_id)}\n")
              summary.write(f"Build: {latest['attributes'].get('version')} (ID: {latest['id']})\n")
              summary.write("Processed KUTANA build is assigned to the existing internal group. "
                            "Apple controls the invitation delivery.\n")
          PY
