name: KUTANA iOS build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulator-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Swift domain and network smoke tests
        run: |
          swiftc -parse-as-library iOS/KUTANA/Core/Domain/Models.swift Tests/domain_smoke.swift -o /tmp/kutana-domain
          /tmp/kutana-domain
          swiftc -parse-as-library iOS/KUTANA/Core/Domain/Models.swift \
            iOS/KUTANA/Core/Domain/Drafts.swift \
            iOS/KUTANA/Core/Networking/Backend.swift \
            iOS/KUTANA/Core/Networking/AuthService.swift \
            Tests/network_smoke.swift -o /tmp/kutana-network
          /tmp/kutana-network
      - name: Draft validation and RPC tests
        run: |
          swiftc -parse-as-library iOS/KUTANA/Core/Domain/Models.swift \
            iOS/KUTANA/Core/Domain/Drafts.swift \
            iOS/KUTANA/Core/Networking/Backend.swift \
            Tests/HTTPBodyFixture.swift Tests/drafts_smoke.swift -o /tmp/kutana-drafts
          /tmp/kutana-drafts
      - name: Publication and seller messaging HTTP contract tests
        run: |
          swiftc -parse-as-library iOS/KUTANA/Core/Domain/Models.swift \
            iOS/KUTANA/Core/Domain/Drafts.swift \
            iOS/KUTANA/Core/Networking/Backend.swift \
            Tests/publications_smoke.swift -o /tmp/kutana-publications
          /tmp/kutana-publications
      - name: Private chat transport tests
        run: |
          swiftc -parse-as-library iOS/KUTANA/Core/Domain/Models.swift \
            iOS/KUTANA/Core/Domain/Drafts.swift \
            iOS/KUTANA/Core/Networking/Backend.swift \
            iOS/KUTANA/Core/Networking/AccessTokenMetadata.swift \
            Tests/HTTPBodyFixture.swift Tests/chat_smoke.swift -o /tmp/kutana-chat
          /tmp/kutana-chat
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Validate Swift source syntax
        run: |
          find iOS/KUTANA -name '*.swift' -print0 | while IFS= read -r -d '' source; do
            swiftc -frontend -parse "$source"
          done
      - name: Build unsigned simulator app with diagnostic log
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -project KUTANA.xcodeproj -scheme KUTANA -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/KUTANADerivedData" \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee "$RUNNER_TEMP/kutana-xcodebuild.log"
      - name: Package compiled simulator app
        if: success()
        run: |
          cd "$RUNNER_TEMP/KUTANADerivedData/Build/Products/Debug-iphonesimulator"
          test -d KUTANA.app
          zip -qry "$RUNNER_TEMP/KUTANA-simulator-app.zip" KUTANA.app
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KUTANA-build-diagnostics
          path: ${{ runner.temp }}/kutana-xcodebuild.log
          if-no-files-found: warn
          retention-days: 7
      - name: Upload simulator build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: KUTANA-iOS-simulator
          path: ${{ runner.temp }}/KUTANA-simulator-app.zip
          if-no-files-found: error
          retention-days: 7
