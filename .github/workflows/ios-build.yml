name: KUTANA iOS build
on:
  push:
    branches: [main, feature/native-premium-motion-20261122]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulator-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Swift domain and network smoke tests
        run: |
          swiftc -parse-as-library iOS/KUTANA/Core/Domain/Models.swift Tests/domain_smoke.swift -o /tmp/kutana-domain
          /tmp/kutana-domain
          swiftc -parse-as-library iOS/KUTANA/Core/Domain/Models.swift \
            iOS/KUTANA/Core/Domain/Drafts.swift \
            iOS/KUTANA/Core/Networking/Backend.swift \
            iOS/KUTANA/Core/Networking/AuthService.swift \
            Tests/network_smoke.swift -o /tmp/kutana-network
          /tmp/kutana-network
      - name: Draft validation and RPC tests
        run: |
          swiftc -parse-as-library iOS/KUTANA/Core/Domain/Models.swift \
            iOS/KUTANA/Core/Domain/Drafts.swift \
            iOS/KUTANA/Core/Networking/Backend.swift \
            Tests/HTTPBodyFixture.swift Tests/drafts_smoke.swift -o /tmp/kutana-drafts
          /tmp/kutana-drafts
      - name: Publication and seller messaging HTTP contract tests
        run: |
          swiftc -parse-as-library iOS/KUTANA/Core/Domain/Models.swift \
            iOS/KUTANA/Core/Domain/Drafts.swift \
            iOS/KUTANA/Core/Networking/Backend.swift \
            Tests/HTTPBodyFixture.swift \
            Tests/publications_smoke.swift -o /tmp/kutana-publications
          /tmp/kutana-publications
      - name: Private chat transport tests
        run: |
          swiftc -parse-as-library iOS/KUTANA/Core/Domain/Models.swift \
            iOS/KUTANA/Core/Domain/Drafts.swift \
            iOS/KUTANA/Core/Networking/Backend.swift \
            iOS/KUTANA/Core/Networking/AccessTokenMetadata.swift \
            Tests/HTTPBodyFixture.swift Tests/chat_smoke.swift -o /tmp/kutana-chat
          /tmp/kutana-chat
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Validate Swift source syntax
        run: |
          find iOS/KUTANA -name '*.swift' -print0 | while IFS= read -r -d '' source; do
            swiftc -frontend -parse "$source"
          done
      - name: Build unsigned simulator app with diagnostic log
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -project KUTANA.xcodeproj -scheme KUTANA -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/KUTANADerivedData" \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee "$RUNNER_TEMP/kutana-xcodebuild.log"
      - name: Package compiled simulator app
        if: success()
        run: |
          cd "$RUNNER_TEMP/KUTANADerivedData/Build/Products/Debug-iphonesimulator"
          test -d KUTANA.app
          zip -qry "$RUNNER_TEMP/KUTANA-simulator-app.zip" KUTANA.app
      - name: Capture guest home on available iPhones
        if: success() && github.event_name == 'workflow_dispatch'
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/luka-screenshots"
          xcrun simctl list devices available -j > "$RUNNER_TEMP/luka-devices.json"
          python3 - "$RUNNER_TEMP/luka-devices.json" > "$RUNNER_TEMP/luka-selected-devices.tsv" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1]))
          devices = [d for runtime, items in data["devices"].items() if "iOS" in runtime
                     for d in items if d.get("isAvailable") and d["name"].startswith("iPhone")]
          choices = [
              ("reference", lambda n: n == "iPhone 16 Pro"),
              ("compact", lambda n: "mini" in n or n.endswith(" SE") or n.endswith(" 16e")),
              ("large", lambda n: "Pro Max" in n or "Plus" in n),
          ]
          used = set()
          for label, match in choices:
              device = next((d for d in devices if match(d["name"]) and d["udid"] not in used), None)
              if device:
                  used.add(device["udid"])
                  print(f'{label}\t{device["udid"]}\t{device["name"]}')
              else:
                  print(f'Missing simulator for {label}', file=sys.stderr)
          if not used:
              raise SystemExit("No suitable iPhone simulator available")
          PY
          while IFS=$'\t' read -r label udid device_name; do
            echo "Capturing $label on $device_name"
            xcrun simctl boot "$udid"
            xcrun simctl bootstatus "$udid" -b
            xcrun simctl install "$udid" "$RUNNER_TEMP/KUTANADerivedData/Build/Products/Debug-iphonesimulator/KUTANA.app"
            xcrun simctl launch "$udid" fr.yaroconsulting.kutana
            sleep 8
            xcrun simctl io "$udid" screenshot "$RUNNER_TEMP/luka-screenshots/$label.png"
            xcrun simctl shutdown "$udid"
          done < "$RUNNER_TEMP/luka-selected-devices.tsv"
      - name: Upload guest home screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LUKA-guest-home-screenshots
          path: ${{ runner.temp }}/luka-screenshots
          if-no-files-found: warn
          retention-days: 7
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KUTANA-build-diagnostics
          path: ${{ runner.temp }}/kutana-xcodebuild.log
          if-no-files-found: warn
          retention-days: 7
      - name: Upload simulator build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: KUTANA-iOS-simulator
          path: ${{ runner.temp }}/KUTANA-simulator-app.zip
          if-no-files-found: error
          retention-days: 7
